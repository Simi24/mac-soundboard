<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUNDBOARD MK-I</title>
<style>
  :root {
    --room: #0a0b0e;
    --chassis-hi: #34373f;
    --chassis-lo: #191b20;
    --panel: #0d0e12;
    --pad-hi: #27292f;
    --pad-lo: #1a1c21;
    --edge: #000;
    --text: #e9eaee;
    --muted: #8b8f9a;
    --ok: #34e07a;
    --warn: #ffb020;
    --red: #ff3b30;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #16181d 0%, var(--room) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* ---------- Chassis ---------- */
  .chassis {
    position: relative;
    width: 100%;
    max-width: 960px;
    border-radius: 24px;
    padding: 28px 28px 20px;
    background: linear-gradient(165deg, var(--chassis-hi) 0%, var(--chassis-lo) 55%, #131519 100%);
    border: 1px solid #06070a;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.09),
      inset 0 -2px 6px rgba(0, 0, 0, 0.5);
  }
  .screw {
    position: absolute;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5c616c, #23252b 70%);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.07);
  }
  .screw::after {
    content: '';
    position: absolute;
    left: 2px; right: 2px; top: 5.5px;
    height: 1.5px;
    background: #0c0d10;
    transform: rotate(38deg);
  }
  .screw.tl { top: 10px; left: 10px; }
  .screw.tr { top: 10px; right: 10px; transform: rotate(70deg); }
  .screw.bl { bottom: 10px; left: 10px; transform: rotate(115deg); }
  .screw.br { bottom: 10px; right: 10px; transform: rotate(20deg); }

  /* ---------- Top panel ---------- */
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .brand h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 6px;
  }
  .brand .mk {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .brand .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 8px var(--warn), inset 0 -1px 1px rgba(0,0,0,.4);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok), inset 0 -1px 1px rgba(0,0,0,.4); }

  .console {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--panel);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 22px;
    border: 1px solid #06070a;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-group label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
  }
  .row { display: flex; align-items: center; gap: 8px; }

  select {
    font-family: var(--mono);
    font-size: 12px;
    background: #16181d;
    color: var(--text);
    border: 1px solid #2c2f37;
    border-radius: 7px;
    padding: 6px 8px;
    max-width: 210px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 110px;
    height: 22px;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 3px;
    background: #08090b;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    margin-top: -8px;
    width: 14px; height: 21px;
    border-radius: 4px;
    background: linear-gradient(180deg, #565b66 0%, #2b2e35 50%, #40444d 100%);
    border: 1px solid #0a0b0d;
    box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
  }
  input[type="checkbox"] { accent-color: var(--ok); width: 15px; height: 15px; }

  button {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text);
    background: linear-gradient(180deg, #33363e, #22242a);
    border: 1px solid #0a0b0d;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 #0d0e11, inset 0 1px 0 rgba(255,255,255,.1);
    transition: filter 0.12s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0d0e11, inset 0 1px 0 rgba(255,255,255,.1); }

  .stop-all {
    margin-left: auto;
    color: #fff;
    font-weight: 700;
    background: radial-gradient(circle at 50% 25%, #ff5b52, #b3140c 80%);
    border-color: #4d0400;
    box-shadow: 0 3px 0 #570803, 0 0 14px rgba(255, 59, 48, 0.35), inset 0 1px 0 rgba(255,255,255,.25);
    padding: 10px 18px;
  }
  .stop-all:active { box-shadow: 0 1px 0 #570803, 0 0 8px rgba(255,59,48,.3), inset 0 1px 0 rgba(255,255,255,.25); }

  /* ---------- Pads ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
    gap: 14px;
  }
  .pad {
    --led: #3ec7ff;
    position: relative;
    aspect-ratio: 1;
    border-radius: 16px;
    background: linear-gradient(170deg, var(--pad-hi), var(--pad-lo) 70%);
    border: 1px solid var(--edge);
    box-shadow:
      0 6px 0 #0a0b0d,
      0 10px 16px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    overflow: hidden;
    user-select: none;
    transition: box-shadow 0.15s;
  }
  .pad::after {
    content: '';
    position: absolute;
    left: 12px; right: 12px; bottom: 6px;
    height: 3px;
    border-radius: 2px;
    background: var(--led);
    opacity: 0.35;
    box-shadow: 0 0 6px var(--led);
  }
  .pad:hover { box-shadow: 0 6px 0 #0a0b0d, 0 10px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08), 0 0 12px color-mix(in srgb, var(--led) 40%, transparent); }
  .pad:active, .pad.playing {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 #0a0b0d,
      0 4px 8px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 0 22px color-mix(in srgb, var(--led) 65%, transparent);
  }
  .pad.playing::after { opacity: 1; box-shadow: 0 0 12px var(--led); }
  .pad .key {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: #0c0d10;
    border: 1px solid #34373f;
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 2px 7px;
  }
  .pad .name {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.25;
    word-break: break-word;
    margin-bottom: 6px;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
  }
  .pad .name input {
    width: 100%;
    font: inherit;
    color: inherit;
    background: #0c0d10;
    border: 1px solid var(--led);
    border-radius: 5px;
    padding: 2px 5px;
  }
  .pad .delete {
    position: absolute;
    top: 8px; right: 8px;
    padding: 2px 7px;
    font-size: 12px;
    background: transparent;
    border: none;
    box-shadow: none;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pad:hover .delete { opacity: 1; }
  .pad .delete:hover { color: var(--red); filter: none; }
  .pad .delete:active { transform: none; }
  .pad .progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    background: var(--led);
    box-shadow: 0 0 8px var(--led);
    width: 0%;
  }
  .pad.add {
    background: transparent;
    border: 2px dashed #2e3138;
    box-shadow: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .pad.add::after { display: none; }
  .pad.add:hover { color: var(--text); border-color: var(--muted); transform: none; }
  .pad.add:active { transform: translateY(2px); }
  .pad.add .plus { font-size: 30px; line-height: 1; }

  /* ---------- Misc ---------- */
  .hint {
    margin-top: 20px;
    padding: 0 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.7;
    letter-spacing: 0.3px;
  }
  kbd {
    background: #0c0d10;
    border: 1px solid #34373f;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    font-family: var(--mono);
    font-size: 10px;
  }
  .banner {
    background: var(--panel);
    border: 1px solid var(--warn);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    box-shadow: 0 0 14px rgba(255, 176, 32, 0.15);
  }
  .banner.visible { display: flex; }
  .drop-overlay {
    position: fixed;
    inset: 14px;
    background: rgba(62, 199, 255, 0.07);
    border: 3px dashed #3ec7ff;
    border-radius: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3ec7ff;
    text-shadow: 0 0 12px rgba(62, 199, 255, 0.6);
    pointer-events: none;
    z-index: 10;
  }
  .drop-overlay.visible { display: flex; }
</style>
</head>
<body>

<div class="chassis">
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="brand">
    <h1>SOUNDBOARD</h1>
    <span class="mk">MK-I</span>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Initializing…</span>
    </div>
  </div>

  <div class="banner" id="permBanner">
    <span>A one-time permission is required to select BlackHole as output.</span>
    <button id="permBtn">Enable</button>
  </div>

  <div class="console">
    <div class="control-group">
      <label for="outputSelect">Meeting output</label>
      <select id="outputSelect"></select>
    </div>
    <div class="control-group">
      <label for="meetVolume">Meeting vol.</label>
      <input type="range" id="meetVolume" min="0" max="1" step="0.05" value="0.8">
    </div>
    <div class="control-group">
      <label for="monitorToggle">Local monitor</label>
      <div class="row">
        <input type="checkbox" id="monitorToggle" checked>
        <input type="range" id="monitorVolume" min="0" max="1" step="0.05" value="0.5">
      </div>
    </div>
    <div class="control-group">
      <label>&nbsp;</label>
      <button id="testOutput">Test output</button>
    </div>
    <button class="stop-all" id="stopAll">■ STOP</button>
  </div>

  <div class="grid" id="grid"></div>

  <p class="hint">
    Drag audio files (mp3/wav/ogg) anywhere on the page to add them.
    <kbd>1</kbd>–<kbd>9</kbd> plays · <kbd>Esc</kbd> stops everything · click a name to rename.
    Sounds are saved in the browser.
  </p>
</div>

<div class="drop-overlay" id="dropOverlay">Drop audio files</div>
<input type="file" id="filePicker" accept="audio/*" multiple hidden>

<script>
'use strict';

// ---------- State ----------
let db = null;
let pads = [];               // {id, name, order, type, buffer}
let outputDeviceId = '';     // sinkId for the meeting output (BlackHole)
const activeAudios = new Set();

const LED_COLORS = ['#3ec7ff', '#ff9f0a', '#34e07a', '#ff375f', '#bf5af2', '#ffd60a', '#64d2ff', '#ff6482', '#5ee6a8'];

const $ = (id) => document.getElementById(id);

// ---------- IndexedDB ----------
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('soundboard', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('pads', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbAll() {
  return new Promise((resolve, reject) => {
    const req = db.transaction('pads').objectStore('pads').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(pad) {
  return new Promise((resolve, reject) => {
    const req = db.transaction('pads', 'readwrite').objectStore('pads').put(pad);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(id) {
  return new Promise((resolve, reject) => {
    const req = db.transaction('pads', 'readwrite').objectStore('pads').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ---------- Audio devices ----------
async function refreshOutputs() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const outputs = devices.filter((d) => d.kind === 'audiooutput');
  const hasLabels = outputs.some((d) => d.label);

  const select = $('outputSelect');
  select.innerHTML = '';
  for (const d of outputs) {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    opt.textContent = d.label || `Output ${select.length + 1}`;
    select.appendChild(opt);
  }

  const blackhole = outputs.find((d) => /blackhole/i.test(d.label));
  if (blackhole) {
    outputDeviceId = blackhole.deviceId;
    select.value = blackhole.deviceId;
    setStatus(true, 'BlackHole connected');
  } else if (hasLabels) {
    outputDeviceId = select.value || '';
    setStatus(false, 'BlackHole not found: sounds will NOT reach the meeting');
  } else {
    setStatus(false, 'Audio permission missing');
    $('permBanner').classList.add('visible');
  }
  return hasLabels;
}

function setStatus(ok, text) {
  $('statusDot').className = 'dot' + (ok ? ' ok' : '');
  $('statusText').textContent = text;
}

async function requestPermission() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((t) => t.stop());
    $('permBanner').classList.remove('visible');
    await refreshOutputs();
  } catch {
    setStatus(false, 'Permission denied: allow microphone access for this page');
  }
}

// ---------- Playback ----------
async function playPad(pad, padEl) {
  const blob = new Blob([pad.buffer], { type: pad.type || 'audio/mpeg' });
  const url = URL.createObjectURL(blob);

  const meet = new Audio(url);
  meet.volume = parseFloat($('meetVolume').value);
  if (outputDeviceId && typeof meet.setSinkId === 'function') {
    try {
      await meet.setSinkId(outputDeviceId);
    } catch (err) {
      console.error('setSinkId failed:', err.name, err.message);
      setStatus(false, `Output not routable (${err.name}): the sound will NOT reach the meeting`);
    }
  } else if (!outputDeviceId) {
    setStatus(false, 'No output selected: the sound will NOT reach the meeting');
  }

  // The local monitor plays OUTSIDE Chrome (via server → afplay): if it played
  // in the browser, Chrome's echo cancellation would cancel the sound in Meet.
  if ($('monitorToggle').checked) {
    fetch(`/monitor?vol=${$('monitorVolume').value}`, {
      method: 'POST',
      body: pad.buffer,
    }).catch(() => {});
  }

  const progress = padEl.querySelector('.progress');
  padEl.classList.add('playing');

  const cleanup = () => {
    meet.pause();
    activeAudios.delete(meet);
    padEl.classList.remove('playing');
    progress.style.width = '0%';
    URL.revokeObjectURL(url);
  };

  meet.addEventListener('ended', cleanup);
  meet.addEventListener('timeupdate', () => {
    if (meet.duration) progress.style.width = `${(meet.currentTime / meet.duration) * 100}%`;
  });

  meet._cleanup = cleanup;
  activeAudios.add(meet);
  meet.play().catch(cleanup);
}

function beepBlob() {
  const rate = 44100, seconds = 1, samples = rate * seconds;
  const buf = new ArrayBuffer(44 + samples * 2);
  const v = new DataView(buf);
  const writeStr = (off, s) => [...s].forEach((c, i) => v.setUint8(off + i, c.charCodeAt(0)));
  writeStr(0, 'RIFF'); v.setUint32(4, 36 + samples * 2, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  writeStr(36, 'data'); v.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) {
    const fade = Math.min(1, (samples - i) / 4000, i / 400);
    v.setInt16(44 + i * 2, Math.sin((2 * Math.PI * 440 * i) / rate) * 12000 * fade, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

async function testOutput() {
  if (!outputDeviceId) {
    setStatus(false, 'No output selected: enable the audio permission first');
    return;
  }
  const url = URL.createObjectURL(beepBlob());
  const audio = new Audio(url);
  audio.addEventListener('ended', () => URL.revokeObjectURL(url));
  try {
    await audio.setSinkId(outputDeviceId);
    await audio.play();
    setStatus(true, 'Test beep sent to the selected output');
  } catch (err) {
    console.error('Output test failed:', err.name, err.message);
    setStatus(false, `Test failed (${err.name}): audio is not reaching the output`);
  }
}

function stopAll() {
  for (const p of [...activeAudios]) (p._cleanup || (() => p.pause()))();
  activeAudios.clear();
  fetch('/stop', { method: 'POST' }).catch(() => {});
}

// ---------- Pad ----------
async function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('audio/')) continue;
    const pad = {
      id: crypto.randomUUID(),
      name: file.name.replace(/\.[^.]+$/, ''),
      order: pads.length,
      type: file.type,
      buffer: await file.arrayBuffer(),
    };
    pads.push(pad);
    await idbPut(pad);
  }
  render();
}

async function deletePad(pad) {
  pads = pads.filter((p) => p.id !== pad.id);
  pads.forEach((p, i) => { p.order = i; });
  await idbDelete(pad.id);
  await Promise.all(pads.map(idbPut));
  render();
}

function startRename(pad, nameEl) {
  const input = document.createElement('input');
  input.value = pad.name;
  nameEl.replaceChildren(input);
  input.focus();
  input.select();
  const commit = async () => {
    pad.name = input.value.trim() || pad.name;
    await idbPut(pad);
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = pad.name; input.blur(); }
    e.stopPropagation();
  });
}

// ---------- Render ----------
function render() {
  const grid = $('grid');
  grid.innerHTML = '';
  pads.sort((a, b) => a.order - b.order);

  pads.forEach((pad, i) => {
    const el = document.createElement('div');
    el.className = 'pad';
    el.style.setProperty('--led', LED_COLORS[i % LED_COLORS.length]);
    el.innerHTML = `
      <span class="key">${i < 9 ? i + 1 : '·'}</span>
      <span class="name"></span>
      <button class="delete" title="Delete">✕</button>
      <div class="progress"></div>
    `;
    const nameEl = el.querySelector('.name');
    nameEl.textContent = pad.name;
    el.addEventListener('click', (e) => {
      if (e.target.closest('.delete') || e.target.closest('input')) return;
      if (e.target === nameEl) return;
      playPad(pad, el);
    });
    nameEl.addEventListener('click', () => startRename(pad, nameEl));
    el.querySelector('.delete').addEventListener('click', () => deletePad(pad));
    grid.appendChild(el);
  });

  const add = document.createElement('div');
  add.className = 'pad add';
  add.innerHTML = '<span class="plus">+</span><span>Add sound</span>';
  add.addEventListener('click', () => $('filePicker').click());
  grid.appendChild(add);
}

// ---------- Global events ----------
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape' || e.key === '0') { stopAll(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && pads[n - 1]) {
    const padEl = $('grid').children[n - 1];
    playPad(pads[n - 1], padEl);
  }
});

let dragCounter = 0;
document.addEventListener('dragenter', (e) => {
  e.preventDefault();
  if (++dragCounter === 1) $('dropOverlay').classList.add('visible');
});
document.addEventListener('dragleave', () => {
  if (--dragCounter === 0) $('dropOverlay').classList.remove('visible');
});
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCounter = 0;
  $('dropOverlay').classList.remove('visible');
  addFiles([...e.dataTransfer.files]);
});

$('filePicker').addEventListener('change', (e) => {
  addFiles([...e.target.files]);
  e.target.value = '';
});
$('stopAll').addEventListener('click', stopAll);
$('testOutput').addEventListener('click', testOutput);
$('permBtn').addEventListener('click', requestPermission);
$('outputSelect').addEventListener('change', (e) => { outputDeviceId = e.target.value; });
navigator.mediaDevices.addEventListener('devicechange', refreshOutputs);

// ---------- Init ----------
(async function init() {
  db = await openDb();
  pads = await idbAll();
  render();
  const hasLabels = await refreshOutputs();
  if (!hasLabels) await requestPermission();
})();
</script>
</body>
</html>
